name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/vendor_portal_ci
      APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-placeholder-auth-secret-change-before-production
      DISABLE_PORTAL_AUTH: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # These whole-tree gates are intentionally unconditional and use the
      # repository's canonical verification contract without a change detector.
      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Verify
        run: npm run verify
