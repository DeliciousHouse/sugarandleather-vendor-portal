services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slvp
      POSTGRES_PASSWORD: slvp_dev
      POSTGRES_DB: slvp_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slvp -d slvp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
